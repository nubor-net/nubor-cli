[project]
name = "nubor"
version = "0.2.0"
description = "A command-line client for OpenStack clouds"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "openstacksdk>=4.0",
    "tabulate>=0.9",
    "PyYAML>=6.0",
]

[project.scripts]
nubor = "nubor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
