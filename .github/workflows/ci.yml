name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e . -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # Proves the spec still produces a working binary on each target before a tag
  # depends on it. The release workflow builds its own artifacts; this only
  # catches spec breakage early.
  binary:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . -r requirements-dev.txt
      - run: pyinstaller --clean --noconfirm nubor.spec
      - name: Smoke test
        shell: bash
        run: |
          BIN=dist/nubor
          [ -f dist/nubor.exe ] && BIN=dist/nubor.exe
          "$BIN" --version
          "$BIN" --help
