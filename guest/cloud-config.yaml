  - path: /etc/systemd/system/nubor-ssh-agent.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=nubor ephemeral SSH key agent
      # The metadata service lives on the link-local address, so there is nothing to
      # sync until the network is up.
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/nubor-ssh-agent
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, nubor-ssh-agent]
